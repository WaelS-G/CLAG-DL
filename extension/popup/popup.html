<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>CLAG Downloader</title>
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="../icons/icon-32.png" width="20" height="20" />
      <span class="title">CLAG Downloader</span>
    </div>
    <div id="statusBadge" class="status-badge connecting">Connecting...</div>
  </div>

  <div class="content">
    <div class="field">
      <input type="text" id="urlInput" placeholder="Enter file or video link..." />
      <button id="downloadBtn" class="btn primary">Download</button>
    </div>

    <div class="section-title">Streams Detected on Page</div>
    <div id="mediaList" class="media-list">
      <div class="empty">No media playing on active tab.</div>
    </div>
  </div>

  <div class="footer">
    <button id="openDashboardBtn" class="btn secondary">Open UIX Dashboard</button>
    <label class="toggle-label">
      <input type="checkbox" id="interceptToggle" checked />
      <span>Catch browser downloads</span>
    </label>
    <div class="author-tag">Made by : <span>Wael Sayed</span></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
