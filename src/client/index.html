<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0B0F19" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

        window.addEventListener('load', () => {

          });
        });
      }
    </script>
